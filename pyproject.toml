[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-obs"
version = "0.1.0"
description = "Regression evals and OpenTelemetry tracing for LLM prompts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arpan Bom" }]
keywords = ["llm", "evaluation", "opentelemetry", "observability"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "opentelemetry-api>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
llm-eval-obs = "llm_eval_obs.cli:main"

[project.urls]
Homepage = "https://github.com/applycoding/llm-eval-observability"
Repository = "https://github.com/applycoding/llm-eval-observability"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
